<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Systems & AI Academy: a CPU chip with a terminal prompt inside. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#262637"/>
      <stop offset="1" stop-color="#11111b"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#94e2d5"/>
      <stop offset="1" stop-color="#cba6f7"/>
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#bg)"/>
  <rect x="8.5" y="8.5" width="239" height="239" rx="55.5" fill="none" stroke="#ffffff" stroke-opacity=".08"/>
  <!-- pins -->
  <g stroke="url(#edge)" stroke-width="10" stroke-linecap="round">
    <path d="M100 44v20M128 44v20M156 44v20"/>
    <path d="M100 192v20M128 192v20M156 192v20"/>
    <path d="M44 100h20M44 128h20M44 156h20"/>
    <path d="M192 100h20M192 128h20M192 156h20"/>
  </g>
  <!-- chip body -->
  <rect x="64" y="64" width="128" height="128" rx="20" fill="#181825" stroke="url(#edge)" stroke-width="10"/>
  <!-- prompt: › and a cursor -->
  <path d="M94 104l26 24-26 24" fill="none" stroke="#94e2d5" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M130 152h32" stroke="#f9e2af" stroke-width="13" stroke-linecap="round"/>
</svg>
