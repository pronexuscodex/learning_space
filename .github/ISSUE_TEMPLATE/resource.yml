name: Suggest a free resource
description: A free book, course, paper, video or tool that belongs in a stage.
labels: [resource]
body:
  - type: input
    id: title
    attributes:
      label: Title and author
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: Link (HTTPS, official site)
    validations:
      required: true
  - type: input
    id: stage
    attributes:
      label: Which stage?
      placeholder: "Stage 6, Operating Systems"
  - type: textarea
    id: why
    attributes:
      label: Why is it good for a self-learner?
    validations:
      required: true
  - type: checkboxes
    id: free
    attributes:
      label: Checks
      options:
        - label: It is free to read or use, and hosted legally by its author or publisher.
          required: true
