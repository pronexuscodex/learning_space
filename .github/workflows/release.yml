name: Release

# Push a tag such as v1.0.0 to build every platform and publish a GitHub
# release with the archives, SHA256SUMS and the matching CHANGELOG section.
# It also runs when a release is published from the GitHub website: then it
# attaches the archives to that release and keeps the notes you wrote.
on:
  push:
    tags: ["v*.*.*"]
  release:
    types: [published]

# A release published on the website creates its tag too, so both events
# can fire; run them one after the other (uploads replace, so it is safe).
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: academy
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache-dependency-path: academy/go.mod
      - name: Test before releasing
        run: |
          go vet ./...
          go test -race ./...
      - name: Build archives
        run: tools/release.sh "$GITHUB_REF_NAME"
      - name: Release notes from CHANGELOG.md
        run: |
          version=${GITHUB_REF_NAME#v}
          awk -v v="$version" '
            /^## / { if (found) exit; if (index($0, "[" v "]") || index($0, " " v)) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then echo "See CHANGELOG.md." > notes.md; fi
          cat notes.md
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            # Published on the website (or re-run): just attach the files.
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            flags=""
            case "$GITHUB_REF_NAME" in *-*) flags="--prerelease" ;; esac
            gh release create "$GITHUB_REF_NAME" dist/* \
              --title "Systems & AI Academy $GITHUB_REF_NAME" \
              --notes-file notes.md $flags
          fi
