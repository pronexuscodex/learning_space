name: Release

# Push a tag such as v1.0.0 to build every platform and publish a GitHub
# release with the archives, SHA256SUMS and the matching CHANGELOG section.
# It also runs when a release is published from the GitHub website: then it
# attaches the archives to that release and keeps the notes you wrote.
on:
  push:
    tags: ["v*.*.*"]
  release:
    types: [published]

# A release published on the website creates its tag too, so both events
# can fire; run them one after the other (uploads replace, so it is safe).
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  # Publishing on the website fires two runs: one for the release, one for
  # the tag it creates. Whichever comes second finds SHA256SUMS already
  # attached and stops here. To rebuild a release, delete its SHA256SUMS.
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      built: ${{ steps.assets.outputs.built }}
    steps:
      - id: assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' 2>/dev/null | grep -qx SHA256SUMS; then
            echo "$GITHUB_REF_NAME already has its files; nothing to do."
            echo "built=true" >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: check
    if: needs.check.outputs.built != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write      # to sign the provenance attestation
      attestations: write  # to store it
    defaults:
      run:
        working-directory: academy
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache-dependency-path: academy/go.mod
      - name: Test before releasing
        run: |
          go vet ./...
          go test -race ./...
      - name: Build archives
        run: tools/release.sh "$GITHUB_REF_NAME"
      # A signed record that this workflow built these exact files from this
      # commit. Check a download with:
      #   gh attestation verify academy-v1.1.0-linux-amd64.tar.gz --repo pronexuscodex/learning_space
      - name: Record build provenance
        uses: actions/attest-build-provenance@v3
        with:
          subject-checksums: academy/dist/SHA256SUMS
      - name: Release notes from CHANGELOG.md
        run: |
          version=${GITHUB_REF_NAME#v}
          awk -v v="$version" '
            /^## / { if (found) exit; if (index($0, "[" v "]") || index($0, " " v)) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then echo "See CHANGELOG.md." > notes.md; fi
          cat notes.md
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            # Published on the website (or re-run): just attach the files.
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            flags=""
            case "$GITHUB_REF_NAME" in *-*) flags="--prerelease" ;; esac
            gh release create "$GITHUB_REF_NAME" dist/* \
              --title "Systems & AI Academy $GITHUB_REF_NAME" \
              --notes-file notes.md $flags
          fi

  # Point the Homebrew formula and the Scoop manifest at the new archives,
  # on the default branch, which is where `brew tap` and `scoop bucket add`
  # read them from. Pre-releases (tags with a hyphen) are skipped.
  packages:
    needs: release
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Update Formula/academy.rb and bucket/academy.json
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$GITHUB_REF_NAME" --pattern SHA256SUMS --dir "$RUNNER_TEMP"
          python3 academy/tools/packages.py "$GITHUB_REF_NAME" "$RUNNER_TEMP/SHA256SUMS"
          git add Formula bucket
          if git diff --cached --quiet; then
            echo "Already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update the Homebrew formula and Scoop manifest to $GITHUB_REF_NAME"
          for attempt in 1 2 3; do
            git push origin HEAD && exit 0
            sleep $((attempt * 5))
            git pull --rebase origin "${{ github.event.repository.default_branch }}"
          done
          exit 1
