name: Links

# Checks that every resource and classic-corner link in the curriculum
# still resolves. It runs when the curriculum changes, weekly (links rot),
# and on demand. It is informational: it is not a required check, because
# a website being down for an hour must not block unrelated work.
on:
  push:
    paths: ["academy/**.go", "**/README.md", ".github/workflows/links.yml"]
  pull_request:
    paths: ["academy/**.go", "**/README.md"]
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: academy
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache-dependency-path: academy/go.mod
      - name: Check every link
        run: go run . -no-color -check-links
      # Research cited in the READMEs: every doi.org link must name a DOI
      # that the DOI registry knows (responseCode 1).
      - name: Check research citations (DOIs)
        if: always()
        working-directory: .
        run: |
          fail=0
          for doi in $(grep -ohE 'https://doi\.org/[^) ]+' README.md academy/README.md | sed 's|https://doi.org/||' | sort -u); do
            code=$(curl -fsS --retry 3 "https://doi.org/api/handles/$doi" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("responseCode"))' || echo error)
            if [ "$code" = 1 ]; then echo "  ✓ $doi"; else echo "  ✗ $doi ($code)"; fail=1; fi
          done
          exit $fail
      # The Library falls back to the Internet Archive when a PDF's link
      # breaks: check, for real, that the archive still answers the way
      # the academy expects (a snapshot timestamp, then the raw PDF bytes).
      - name: Internet Archive fallback still works
        if: always()
        env:
          ACADEMY_LIVE_ARCHIVE: "1"
        run: go test -count=1 -run TestArchiveLive -v .
